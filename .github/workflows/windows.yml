name: Windows build
# The tools and tests built by scripts/setup.py on Windows, with Clang (the
# default) and with MSVC. No ROM set: the game itself is not recompiled here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, msvc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup (fetch, configure, build)
        env:
          M2_COMPILER: ${{ matrix.compiler }}
        run: python scripts/setup.py
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
